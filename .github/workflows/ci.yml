name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]

permissions: {}

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    # No prebuilds are committed to the repo, so on Windows this compiles the addon from
    # source with the default (stock-toolchain) settings. See windows-toolchains.yml for the
    # matrix that pins specific MSVC toolsets.
    - run: npm ci
    - run: npm run lint
    - run: npm run compile
    - run: npm run test
